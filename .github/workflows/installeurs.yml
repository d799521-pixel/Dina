name: Installeurs

# Fabrique les installeurs Windows, macOS et Linux à chaque envoi de code.
# Ils se téléchargent depuis l'onglet « Actions » (section « Artifacts »).
# Une étiquette « v1.2.3 » publie en plus une « Release » GitHub.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  installeur:
    needs: verifier
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Dina-Windows
            fichiers: |
              release/*.exe
          - os: macos-latest
            nom: Dina-Mac
            fichiers: |
              release/*.dmg
          - os: ubuntu-latest
            nom: Dina-Linux
            fichiers: |
              release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish never
        env:
          # Pas de certificat de signature : installeurs non signés.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.fichiers }}
